# Instance-specific values go into docker-compose.override.yml and .env; copy
# docker-compose.override.yml.template to get started. The monitor keeps no data
# of its own, so this stack has no volumes and nothing to back up.

services:
  monitor:
    build: .
    image: nanopub/monitor:${NANOPUB_MONITOR_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      # Plain HTTP. The monitor serves public, read-only pages and has no
      # authentication of its own; to publish it, run a reverse proxy on the host
      # that terminates TLS (see README, "Running an Instance").
      - "7890:8080"
    environment:
      # Make the application's own log show up in `docker compose logs`. Both parts
      # are needed: slf4j-simple otherwise writes to stderr, which Tomcat captures
      # into its internal logging while the webapp starts up, and it logs nothing
      # below WARN. An override that sets JAVA_OPTS replaces this whole value, so
      # repeat these two flags there.
      - JAVA_OPTS=-Dorg.slf4j.simpleLogger.logFile=System.out -Dorg.slf4j.simpleLogger.defaultLogLevel=info
    logging:
      options:
        max-size: "10m"
        max-file: "3"
