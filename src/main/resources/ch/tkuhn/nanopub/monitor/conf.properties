# Configuration file for nanopub monitor
#
# This file holds the defaults. Each setting can be overridden, in increasing
# order of precedence, by:
#
#  1. a file called 'local.conf.properties' on the classpath (not under version
#     control), for a build you control;
#  2. an environment variable named after the setting, in upper case and with
#     hyphens turned into underscores, behind 'NANOPUB_MONITOR_' - so 'scan-freq'
#     is overridden by NANOPUB_MONITOR_SCAN_FREQ. This is the way to configure a
#     Docker deployment, where neither of the two files can be edited without
#     rebuilding the image; see docker-compose.override.yml.template.

# Scan frequency in seconds:
scan-freq=10

# Number of parallel workers used to test servers in each scan:
scan-threads=8

# Show or hide map:
show-map=true

# Look up server locations via ip-api.com (see README, 'Running an Instance'):
get-geoip-info=true
