<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">

<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Nanopub Monitor</title>
  <link rel="stylesheet" href="style.css?v=8" type="text/css"/>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.svg?v=3">
  <script src="theme.js?v=1"></script>
  <script src="world.js"></script>
  <script src="drawmap.js?v=5" defer></script>
  <script src="summarybar.js?v=2" defer></script>
</head>

<body>

<div class="page">

<header>
  <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch colour mode">
    <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
  </button>
  <h1>Nanopub Monitor</h1>
  <p class="counts" wicket:id="counts">
    <strong wicket:id="server-count"></strong> nanopub services
    running on approximately <strong wicket:id="server-ip-count"></strong> distinct servers
  </p>
</header>

<div id="map" wicket:id="map"></div>

<div class="servertable" wicket:id="tablecontainer">
  <nav class="summary" id="summary" aria-label="Service types">
    <a class="summary-card" wicket:id="summary">
      <span class="summary-name"><span class="swatch" wicket:id="swatch"></span><span wicket:id="title"></span></span>
      <span class="summary-tally"><b wicket:id="ok"></b> of <span wicket:id="total"></span> OK<span wicket:id="attention"> · <span class="summary-problems" wicket:id="attention-count"></span></span></span>
    </a>
  </nav>

  <nav class="summary-bar" id="summary-bar" aria-label="Service types">
    <div class="summary-bar-inner">
      <a class="summary-chip" wicket:id="summary-bar"><span class="swatch" wicket:id="swatch"></span><span wicket:id="title"></span><span class="summary-chip-tally" wicket:id="tally"></span><span class="summary-chip-attention" wicket:id="attention"></span></a>
    </div>
  </nav>

  <section class="service-type" wicket:id="sections">
    <div class="section-head">
      <h2><span class="swatch" wicket:id="swatch"></span><span wicket:id="title"></span></h2>
      <span class="section-meta" wicket:id="instances"></span>
      <span class="section-types"><a class="type-link mono" wicket:id="types" target="_blank" rel="noopener"><span wicket:id="type-label"></span></a></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Service</th>
            <th>Status</th>
            <th wicket:id="trust-header">Setting / trust state</th>
            <th wicket:id="checksum-header">Checksum</th>
            <th class="num" wicket:id="count-header">Nanopubs</th>
            <th class="num" wicket:id="sync-header">Sync</th>
            <th class="num" wicket:id="loader-header">Loader</th>
            <th>Health</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody>
          <tr wicket:id="rows">
            <td class="svc"><a wicket:id="urllink" target="_blank" rel="noopener"><span wicket:id="url"></span></a><span wicket:id="testchip" class="test-chip">TEST</span><span class="sub" wicket:id="version"></span><span class="sub mono" wicket:id="row-type"></span></td>
            <td data-label="Status"><span class="badge" wicket:id="status"></span></td>
            <td data-label="Setting / trust state" wicket:id="trust"><span class="mono" wicket:id="setting"></span><span class="sub"><span wicket:id="trust-hash"></span><span class="pill" wicket:id="trust-group"></span></span></td>
            <td data-label="Checksum" wicket:id="checksum"><span class="mono" wicket:id="checksum-hash"></span><span class="pill" wicket:id="checksum-group"></span></td>
            <td class="num" data-label="Nanopubs" wicket:id="count"></td>
            <td class="num" data-label="Sync" wicket:id="sync"></td>
            <td class="num" data-label="Loader" wicket:id="loader"></td>
            <td data-label="Health"><span wicket:id="ok-ratio"></span><span wicket:id="resp-time"></span><span class="sub" wicket:id="last-seen"></span></td>
            <td data-label="Location"><span wicket:id="place"></span><span class="sub" wicket:id="region"></span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>

<p class="exports">
  [ <a href=".csv" rel="alternate" type="text/csv">csv</a> ]
  [ <a href=".json" rel="alternate" type="application/json">json</a> ]
</p>

</div>

</body>

</html>
