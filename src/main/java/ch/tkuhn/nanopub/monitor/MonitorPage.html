<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">

<head>
  <meta charset="utf-8"/>
  <title>Nanopub Monitor</title>
  <link rel="stylesheet" href="style.css?v=4" type="text/css"/>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.svg?v=3">
  <script src="world.js"></script>
  <script src="drawmap.js?v=5" defer></script>
</head>

<body>

<h1>Nanopub Monitor</h1>

<p wicket:id="counts">
  <span wicket:id="server-count"></span> <strong>nanopub services</strong>
  running on approximately <span wicket:id="server-ip-count"></span> <strong>distinct servers</strong>
</p>

<div id="map" wicket:id="map"></div>

<div class="servertable" wicket:id="tablecontainer">
  <table>
    <tr>
      <th>URL</th>
      <th>Type</th>
      <th>Version</th>
      <th>Status</th>
      <th>Setting / Checksum</th>
      <th>Nanopubs</th>
      <th>Sync</th>
      <th>Loader</th>
      <th>OK Ratio</th>
      <th>Resp Time (Dist)</th>
      <th>Last Seen OK</th>
      <th>IP Address</th>
      <th>Region</th>
      <th>Server Location</th>
    </tr>
    <tr wicket:id="rows">
      <td><a wicket:id="urllink"><span wicket:id="url"></span></a></td>
      <td><a wicket:id="typelink"><span wicket:id="type"></span></a> <span wicket:id="testchip" class="test-chip">TEST</span></td>
      <td><span wicket:id="version"></span></td>
      <td><span wicket:id="status"></span></td>
      <td><span wicket:id="trusthash"></span></td>
      <td><span wicket:id="nanopubcount"></span></td>
      <td><span wicket:id="synclag"></span></td>
      <td><span wicket:id="loaderage"></span></td>
      <td><span wicket:id="successratio"></span></td>
      <td><span wicket:id="resptime"></span></td>
      <td><span wicket:id="lastseen"></span></td>
      <td><span wicket:id="ip"></span></td>
      <td><span wicket:id="region"></span></td>
      <td><span wicket:id="location"></span></td>
    </tr>
  </table>
</div>

<p>
  [ <a href=".csv" rel="alternate" type="text/csv">csv</a> ]
  [ <a href=".json" rel="alternate" type="application/json">json</a> ]
</p>

</body>

</html>
